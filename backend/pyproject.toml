[tool.poetry]
name = "niraj-backend"
version = "0.1.0"
description = "NIRAJ - Advanced Self-Learning Algorithmic AI Personal Trading System Backend"
authors = ["NIRAJ System"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
redis = "^5.0.1"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.25.2"
websockets = "^12.0"
pandas = "^2.1.4"
numpy = "^1.26.2"
requests = "^2.31.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"
structlog = "^23.2.0"
ollama = "^0.1.7"
aiosqlite = "^0.21.0"
pyotp = "^2.9.0"
cryptography = "^46.0.1"
sentence-transformers = "^2.2.2"
torch = {version = "^2.0.0", extras = ["cuda"]}
scikit-learn = "^1.3.0"
aiohttp = "^3.9.1"
backoff = "^2.2.1"
pydantic = ">=2.0,<3.0"
qrcode = "^8.2"
feedparser = "^6.0.10"
psutil = "^5.9.0"
lark = "^1.3.0"
h2 = "^4.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-mock = "^3.12.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

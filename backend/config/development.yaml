# NIRAJ System Configuration
# Development Environment

application:
  name: "NIRAJ"
  version: "0.1.0"
  description: "Advanced Self-Learning Algorithmic AI Personal Trading System"
  environment: "development"
  debug: true

server:
  host: "localhost"
  port: 8000
  reload: true
  workers: 1

database:
  url: "sqlite:///./data/niraj.db"
  echo: false
  pool_pre_ping: true
  pool_recycle: 3600

redis:
  url: "redis://localhost:6379/0"
  max_connections: 20
  retry_on_timeout: true
  socket_keepalive: true

auth:
  secret_key: "dev-secret-key-change-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 1440
  live_trading_pin: "1937"

trading:
  default_mode: "paper"
  max_position_size: 100000
  risk_percentage: 2.0
  enable_paper_trading: true
  enable_live_trading: false

brokers:
  angel_one:
    enabled: true
    base_url: "https://apiconnect.angelbroking.com"
    timeout: 30

  dhan:
    enabled: false
    base_url: "https://api.dhan.co"
    timeout: 30

external_apis:
  news:
    default_language: "en"
    default_country: "in"
    default_category: "business"
    max_articles_per_request: 100
    enable_sentiment_analysis: false
    enable_content_filtering: true

    # NewsAPI.org configuration
    newsapi:
      enabled: true
      base_url: "https://newsapi.org/v2"
      api_key: ""  # Set your NewsAPI key here
      timeout: 15
      max_retries: 3
      retry_delay: 1.0
      rate_limit_requests_per_day: 1000
      rate_limit_requests_per_hour: 100
      cache_duration_minutes: 15

    # Financial Modeling Prep configuration
    fmp:
      enabled: false
      base_url: "https://financialmodelingprep.com/api/v3"
      api_key: ""  # Set your FMP key here
      timeout: 20
      max_retries: 3
      retry_delay: 1.0
      rate_limit_requests_per_minute: 250
      cache_duration_minutes: 30

    # Alpha Vantage News configuration
    alphavantage:
      enabled: false
      base_url: "https://www.alphavantage.co/query"
      api_key: ""  # Set your Alpha Vantage key here
      timeout: 15
      max_retries: 3
      retry_delay: 1.0
      rate_limit_requests_per_minute: 5
      cache_duration_minutes: 60

    # RSS Feeds configuration
    rss:
      enabled: true
      timeout: 20
      max_retries: 3
      retry_delay: 2.0
      cache_duration_minutes: 10
      feeds:
        - name: "Economic Times Markets"
          url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
        - name: "Moneycontrol Markets"
          url: "https://www.moneycontrol.com/rss/markets.xml"
        - name: "Business Standard Markets"
          url: "https://www.business-standard.com/rss/markets-106.rss"
        - name: "Reuters Business"
          url: "https://feeds.reuters.com/reuters/businessNews"
        - name: "Yahoo Finance"
          url: "https://feeds.finance.yahoo.com/rss/2.0/headline"

  weather:
    api_key: "${WEATHER_API_KEY:}"  # Set your OpenWeatherMap API key here
    base_url: "https://api.openweathermap.org/data/2.5"
    geocoding_url: "http://api.openweathermap.org/geo/1.0"
    onecall_url: "https://api.openweathermap.org/data/3.0"

    timeout: 15
    max_retries: 3
    retry_delay: 1.0

    # Rate limiting (OpenWeatherMap free tier: 60 calls/minute, 1000 calls/day)
    rate_limit_calls_per_minute: 50
    rate_limit_calls_per_month: 1000000

    # Cache settings for different data types
    current_weather_cache_minutes: 10
    forecast_cache_minutes: 60
    alerts_cache_minutes: 5
    historical_cache_minutes: 1440

    # Default settings
    default_units: "metric"  # metric, imperial, kelvin
    default_language: "en"   # en, hi, mr, bn, gu, ta, te

    # Trading-specific features
    enable_commodity_analysis: true
    enable_weather_alerts: true
    enable_agricultural_insights: true
    enable_energy_insights: true

    # Circuit breaker for API resilience
    circuit_breaker:
      failure_threshold: 5
      recovery_timeout: 60

ai:
  ollama:
    base_url: "http://localhost:11434"
    model: "gemma3:4b-it-q4_K_M"
    timeout: 120
    max_tokens: 4096
    temperature: 0.7

  features:
    enable_predictions: true
    enable_sentiment_analysis: true
    enable_risk_assessment: true
    prediction_confidence_threshold: 0.7

strategies:
  max_concurrent: 5
  default_risk_per_trade: 1.0
  enable_paper_mode_by_default: true

  predatory:
    enabled: true
    max_positions: 3

  quantitative:
    enabled: true
    max_positions: 5

  psychological:
    enabled: true
    max_positions: 2

market_data:
  cache_duration: 300  # 5 minutes
  real_time_enabled: true
  historical_lookback_days: 365

  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "1d"

risk_management:
  max_daily_loss_percentage: 5.0
  max_drawdown_percentage: 10.0
  position_sizing_method: "fixed_percentage"
  enable_circuit_breakers: true

  circuit_breakers:
    max_consecutive_losses: 3
    cooldown_period_minutes: 30

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/niraj.log"
  max_file_size: "10MB"
  backup_count: 5

  loggers:
    - name: "niraj"
      level: "INFO"
    - name: "trading"
      level: "DEBUG"
    - name: "ai"
      level: "INFO"

monitoring:
  enable_health_checks: true
  health_check_interval: 60  # seconds
  enable_metrics: true
  metrics_port: 9090

websocket:
  heartbeat_interval: 30
  max_connections: 100
  message_queue_size: 1000

features:
  paper_trading: true
  live_trading: false  # Requires PIN
  ai_analysis: true
  real_time_data: true
  backtesting: true
  portfolio_optimization: true
